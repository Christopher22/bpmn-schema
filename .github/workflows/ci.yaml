name: Rust CI + Docs

on:
  push:
    branches: ["develop"]
  pull_request:
    branches: ["develop"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: "pages"
  cancel-in-progress: false
jobs:
  # ──────────────────────────────────────────────────────────────
  # Build + test + clippy
  # ──────────────────────────────────────────────────────────────
  build:
    name: Build, Test & Lint
    runs-on: ubuntu-latest
    # Cache cargo registry, git index and target for speed
    strategy:
      matrix:
        os: [ubuntu-latest]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Rust
        run: rustup update stable && rustup default stable
      - name: Run tests
        run: cargo test --all

  # ──────────────────────────────────────────────────────────────
  # Publish docs to GitHub Pages
  # ──────────────────────────────────────────────────────────────
  publish-docs:
    name: Publish Docs
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build           # Only run after the build job succeeds
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Re‑build documentation
        run: |
          cargo doc --no-deps
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './target/doc/'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
